[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "melodix"
version = "0.1.0"
description = "Optical Music Recognition for drum sheet music: PDF/image to multi-track MIDI, MP3, and interactive sync metadata."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Melodix Contributors" }]
keywords = ["omr", "optical-music-recognition", "drums", "midi", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

# Stage 1 (geometry) + Stage 3 (reconstruction) only.
# Deliberately lean: `pip install melodix` must not pull a 2 GB CUDA wheel.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mido>=1.3",
    "pypdfium2>=4.30",
    "Pillow>=10.2",
]

[project.optional-dependencies]
# Stage 2: symbol recognition. Drags in torch + torchvision.
vision = [
    "ultralytics>=8.2",
    "torch>=2.2",
]
# Stage 4: synthesis and encoding. Both wrap system binaries (see README).
audio = [
    "pyfluidsynth>=1.3",
    "pydub>=0.25",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-Pillow",
]
all = ["melodix[vision,audio]"]

[project.scripts]
melodix = "melodix.cli:main"

[project.urls]
Homepage = "https://github.com/melodix/melodix"
Issues = "https://github.com/melodix/melodix/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/melodix"]

# ---------------------------------------------------------------- pytest ----

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "slow: tests that take more than a second (deselect with '-m \"not slow\"')",
    "requires_model: needs a trained YOLO checkpoint on disk",
    "requires_soundfont: needs a .sf2 soundfont on disk",
]

[tool.coverage.run]
source = ["src/melodix"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# ------------------------------------------------------------------ ruff ----

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "RET",       # return
    "PTH",       # use pathlib
    "NPY",       # numpy-specific
    "D",         # pydocstyle
    "ANN",       # annotations
]
ignore = [
    "D107",   # __init__ docstring — covered by the class docstring
    "D203",   # incompatible with D211
    "D213",   # incompatible with D212
    "ANN401", # allow Any in narrow adapter signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "ANN201", "ANN001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ------------------------------------------------------------------ mypy ----

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
files = ["src/melodix", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "fluidsynth.*", "pydub.*", "ultralytics.*", "pypdfium2.*"]
ignore_missing_imports = true